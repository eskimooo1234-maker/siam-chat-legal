<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal — SIAM CHAT</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #111827;
    --text-secondary: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --surface: #f9fafb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a; --text: #f1f5f9; --text-secondary: #94a3b8;
      --border: #1e293b; --accent: #60a5fa; --surface: #1e293b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f172a; --text: #f1f5f9; --text-secondary: #94a3b8;
    --border: #1e293b; --accent: #60a5fa; --surface: #1e293b;
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --text: #111827; --text-secondary: #6b7280;
    --border: #e5e7eb; --accent: #2563eb; --surface: #f9fafb;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .container { max-width: 480px; width: 100%; }
  .badge {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 4px 12px;
    border-radius: 4px;
    margin-bottom: 20px;
  }
  h1 { font-size: 32px; font-weight: 800; margin-bottom: 8px; }
  .subtitle { font-size: 15px; color: var(--text-secondary); margin-bottom: 40px; }
  .card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    text-decoration: none;
    color: var(--text);
    margin-bottom: 12px;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: var(--accent); }
  .card-left { display: flex; align-items: center; gap: 16px; }
  .icon {
    width: 44px; height: 44px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .card-title { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
  .card-subtitle { font-size: 13px; color: var(--text-secondary); }
  .arrow { font-size: 18px; color: var(--text-secondary); }
  footer {
    margin-top: 48px;
    font-size: 13px;
    color: var(--text-secondary);
    text-align: center;
  }
</style>
</head>
<body>
<div class="container">
  <div class="badge">SIAM CHAT</div>
  <h1>Legal</h1>
  <p class="subtitle">เอกสารทางกฎหมายสำหรับแอปพลิเคชัน SIAM CHAT</p>

  <a href="privacy.html" class="card">
    <div class="card-left">
      <div class="icon">🔒</div>
      <div>
        <div class="card-title">Privacy Policy</div>
        <div class="card-subtitle">นโยบายความเป็นส่วนตัว</div>
      </div>
    </div>
    <span class="arrow">›</span>
  </a>

  <a href="terms.html" class="card">
    <div class="card-left">
      <div class="icon">📋</div>
      <div>
        <div class="card-title">Terms of Service</div>
        <div class="card-subtitle">ข้อกำหนดการใช้งาน</div>
      </div>
    </div>
    <span class="arrow">›</span>
  </a>

  <footer>
    &copy; 2569 Siam Chat Dev &nbsp;·&nbsp;
    <a href="mailto:eskimooo1234@gmail.com" style="color: var(--accent);">eskimooo1234@gmail.com</a>
  </footer>
</div>
</body>
</html>
