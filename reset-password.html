<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รีเซ็ตรหัสผ่าน — SIAM CHAT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #ffffff; --text: #111827; --text-secondary: #6b7280;
    --border: #e5e7eb; --accent: #2563eb; --surface: #f9fafb;
    --danger: #dc2626; --success: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a; --text: #f1f5f9; --text-secondary: #94a3b8;
      --border: #1e293b; --accent: #60a5fa; --surface: #1e293b;
      --danger: #f87171; --success: #4ade80;
    }
  }
  :root[data-theme="dark"]  { --bg:#0f172a;--text:#f1f5f9;--text-secondary:#94a3b8;--border:#1e293b;--accent:#60a5fa;--surface:#1e293b;--danger:#f87171;--success:#4ade80; }
  :root[data-theme="light"] { --bg:#ffffff;--text:#111827;--text-secondary:#6b7280;--border:#e5e7eb;--accent:#2563eb;--surface:#f9fafb;--danger:#dc2626;--success:#16a34a; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 16px; line-height: 1.6;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%; max-width: 420px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px 28px; gap: 0;
  }
  .badge {
    display: inline-block; background: var(--accent); color: #fff;
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    padding: 3px 10px; border-radius: 4px; margin-bottom: 16px;
  }
  h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
  .sub { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; line-height: 1.5; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .input-wrap { position: relative; margin-bottom: 16px; }
  input[type="password"], input[type="text"] {
    width: 100%; border: 1.5px solid var(--border); border-radius: 10px;
    padding: 12px 44px 12px 14px; font-size: 15px;
    color: var(--text); background: var(--bg); outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: var(--accent); }
  .eye-btn {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 4px;
    color: var(--text-secondary); font-size: 18px; line-height: 1;
  }
  .hint { font-size: 12px; color: var(--text-secondary); margin-top: -10px; margin-bottom: 16px; }
  .btn {
    width: 100%; background: var(--accent); color: #fff;
    border: none; border-radius: 10px; padding: 14px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: opacity 0.15s; margin-top: 4px;
  }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg {
    margin-top: 16px; padding: 12px 14px; border-radius: 8px;
    font-size: 14px; line-height: 1.5; display: none;
  }
  .msg.error   { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 25%, transparent); }
  .msg.success { background: color-mix(in srgb, var(--success) 12%, transparent); color: var(--success); border: 1px solid color-mix(in srgb, var(--success) 25%, transparent); }
  .msg.show { display: block; }
  .back { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-secondary); }
  /* loading state */
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* invalid link state */
  .invalid-card { text-align: center; }
  .invalid-icon { font-size: 40px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="card" id="mainCard">
  <div class="badge">SIAM CHAT</div>

  <!-- Form shown when token is valid -->
  <div id="formView">
    <h1>ตั้งรหัสผ่านใหม่</h1>
    <p class="sub">กรอกรหัสผ่านใหม่ที่ต้องการ อย่างน้อย 6 ตัวอักษร</p>

    <label for="pw1">รหัสผ่านใหม่</label>
    <div class="input-wrap">
      <input type="password" id="pw1" placeholder="อย่างน้อย 6 ตัวอักษร" autocomplete="new-password">
      <button class="eye-btn" type="button" onclick="toggleEye('pw1','eye1')" id="eye1" aria-label="แสดง/ซ่อนรหัสผ่าน">👁</button>
    </div>

    <label for="pw2">ยืนยันรหัสผ่านใหม่</label>
    <div class="input-wrap">
      <input type="password" id="pw2" placeholder="พิมพ์รหัสผ่านอีกครั้ง" autocomplete="new-password">
      <button class="eye-btn" type="button" onclick="toggleEye('pw2','eye2')" id="eye2" aria-label="แสดง/ซ่อนรหัสผ่าน">👁</button>
    </div>
    <p class="hint">รหัสผ่านต้องตรงกันทั้งสองช่อง</p>

    <button class="btn" id="submitBtn" onclick="handleSubmit()">บันทึกรหัสผ่านใหม่</button>
    <div class="msg" id="msg"></div>
    <a href="index.html" class="back">← กลับหน้าหลัก</a>
  </div>

  <!-- Shown when link is invalid / expired -->
  <div id="invalidView" style="display:none;" class="invalid-card">
    <div class="invalid-icon">🔗</div>
    <h1>ลิงก์หมดอายุหรือใช้ไปแล้ว</h1>
    <p class="sub" style="margin-top:8px;">ลิงก์รีเซ็ตรหัสผ่านใช้ได้ครั้งเดียวและหมดอายุหลัง 1 ชั่วโมง<br>กรุณาขอลิงก์ใหม่จากแอป SIAM CHAT</p>
    <a href="index.html" class="back" style="margin-top:24px;">← กลับหน้าหลัก</a>
  </div>
</div>

<script>
  // ── Supabase init ───────────────────────────────────────────────────────────
  // ตั้งชื่อตัวแปรเป็น supabaseClient (ไม่ใช่ supabase) เพราะ
  // window.supabase ถูก CDN ใช้เป็น namespace แล้ว — ชนกันทำให้เกิด
  // "Identifier 'supabase' has already been declared"
  const supabaseClient = window.supabase.createClient(
    'https://bgiqmqiklugwwlvgqhme.supabase.co',
    'sb_publishable_dFK2_27SvsL4xlUIwExp9Q_-Pzqm4u9'
  );

  // ── Parse recovery token from URL hash ─────────────────────────────────────
  // Supabase password-reset email redirects to this page with fragment:
  //   #access_token=xxx&refresh_token=xxx&type=recovery
  // We set the session from these tokens, then let the user set a new password.
  (async () => {
    const hash = window.location.hash.replace(/^#/, '');
    const params = new URLSearchParams(hash);
    const accessToken  = params.get('access_token');
    const refreshToken = params.get('refresh_token');
    const type         = params.get('type');

    if (!accessToken || type !== 'recovery') {
      showInvalid();
      return;
    }

    const { error } = await supabaseClient.auth.setSession({
      access_token:  accessToken,
      refresh_token: refreshToken ?? '',
    });

    if (error) {
      showInvalid();
    }
    // If setSession succeeded, formView is already visible — user can proceed
  })();

  // ── UI helpers ──────────────────────────────────────────────────────────────
  function showInvalid() {
    document.getElementById('formView').style.display  = 'none';
    document.getElementById('invalidView').style.display = 'block';
  }

  function toggleEye(inputId, btnId) {
    const input = document.getElementById(inputId);
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg show ' + type;
  }

  function setLoading(on) {
    const btn = document.getElementById('submitBtn');
    btn.disabled = on;
    btn.innerHTML = on
      ? '<span class="spinner"></span>กำลังบันทึก…'
      : 'บันทึกรหัสผ่านใหม่';
  }

  // ── Submit ──────────────────────────────────────────────────────────────────
  async function handleSubmit() {
    const pw1 = document.getElementById('pw1').value;
    const pw2 = document.getElementById('pw2').value;

    if (!pw1 || !pw2) {
      showMsg('กรุณากรอกรหัสผ่านให้ครบทั้งสองช่อง', 'error');
      return;
    }
    if (pw1.length < 6) {
      showMsg('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร', 'error');
      return;
    }
    if (pw1 !== pw2) {
      showMsg('รหัสผ่านทั้งสองช่องไม่ตรงกัน', 'error');
      return;
    }

    setLoading(true);
    const { error } = await supabaseClient.auth.updateUser({ password: pw1 });
    setLoading(false);

    if (error) {
      showMsg('เกิดข้อผิดพลาด: ' + error.message, 'error');
      return;
    }

    // Success — hide form, show success message, then sign out the recovery session
    document.getElementById('pw1').disabled = true;
    document.getElementById('pw2').disabled = true;
    document.getElementById('submitBtn').style.display = 'none';
    showMsg('✓ ตั้งรหัสผ่านใหม่สำเร็จ! กลับไปเปิดแอป SIAM CHAT แล้วเข้าสู่ระบบด้วยรหัสผ่านใหม่ได้เลย', 'success');
    await supabaseClient.auth.signOut();
  }

  // ── Enter key submits ───────────────────────────────────────────────────────
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleSubmit();
  });
</script>
</body>
</html>
